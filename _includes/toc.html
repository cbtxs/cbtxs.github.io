{% assign toc_content = include.content | default: page.content %}
{% if site.toc and page.toc %}
{% assign toc_links = toc_content | table_of_contents %}
{% unless toc_links == empty %}
<div id="toc-wrapper" class="pl-0 pr-4 mb-5">
  <div class="panel-heading pl-3 pt-2 mb-2">{{- site.data.locales[lang].panel.toc -}}</div>
  <nav id="toc" data-toggle="toc" aria-label="Contents">{{ toc_links }}</nav>
</div>
{% endunless %}
{% endif %}
